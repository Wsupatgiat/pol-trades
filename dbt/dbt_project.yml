name: pol_trades_dbt

profile: pol-trades

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

# seeds:
  # Builds seeds into '<your_schema_name>_raw'
  # dbt:
  #   +schema: raw

models:
  pol_trades_dbt:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    # database = layer; schema comes from the target (testing or pol_trades)
    staging:
      +materialized: view
      +database: staging
    marts:
      +materialized: table
      +database: analytics
